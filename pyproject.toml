[project]
name = "pcb2gcode-ui"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "flet",
    "gcodeparser>=0.3,<0.4",
    "pillow>=8",
    "pygerber>=2.4.3,<3",
]

[project.optional-dependencies]
dev = [
    "flake8",
    "pytest",
    "pytest-regressions",
    "ruff",
]

[project.scripts]
pcb2gcode-ui = "pcb2gcode_ui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pcb2gcode_ui"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = [
    "ignore::pyparsing.exceptions.PyparsingDeprecationWarning",
]
